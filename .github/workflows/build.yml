name: Build SysLAnd Release Artifacts

on:
  push:
    branches: [ main, master, 'sysland*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK and AAB
        run: ./gradlew assembleUserLAndRelease bundleUserLAndRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysland-release-apk
          path: app/build/outputs/apk/UserLAnd/release/*.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysland-release-aab
          path: app/build/outputs/bundle/UserLAndRelease/*.aab
